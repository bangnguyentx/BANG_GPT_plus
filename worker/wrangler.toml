name = "chatgpt-pro-api"
main = "worker.js"
compatibility_date = "2026-11-19"

# Sau khi tạo D1 Database trên Cloudflare Dashboard tên là "chatgpt_db",
# dán database_id thật của bạn vào dòng dưới (hoặc gán D1 Binding tên "DB" ngay trên Cloudflare Dashboard):
[[d1_databases]]
binding = "DB"
database_name = "chatgpt_db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
