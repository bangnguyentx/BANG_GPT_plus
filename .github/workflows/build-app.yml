name: Build & Release Android APK (API AI v3.3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle (tăng tốc & chống lỗi 429)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apiai-cap6-v33-${{ hashFiles('capacitor.config.json', '.github/workflows/build-app.yml') }}
          restore-keys: |
            gradle-apiai-cap6-v33-
            gradle-apiai-cap6-

      - name: Chuẩn bị www và cài Capacitor 6
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          mkdir -p www
          for f in index.html app.css app.js skills-pack.js logo.png logo-mark.png; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then
              cp "$f" "www/$f"
            fi
          done

          node << 'EOF'
          const fs = require("fs");
          const verCode = 10 + parseInt(process.env.RUN_NUM || "1", 10);
          const verName = `2.0.${process.env.RUN_NUM || "1"}`;
          const repo = process.env.GITHUB_REPO || "bangnguyentx/BANG_GPT";
          const apiUrl = (process.env.BACKEND_API_URL || "").trim();

          if (!fs.existsSync("www/index.html")) {
            throw new Error("Khong tim thay file www/index.html trong repo!");
          }

          let html = fs.readFileSync("www/index.html", "utf8");
          html = html
            .replace(/__APP_VERSION_CODE__/g, String(verCode))
            .replace(/__APP_VERSION_NAME__/g, verName)
            .replace(/__GITHUB_REPO__/g, repo)
            .replace(/__DEFAULT_WORKER_URL__/g, apiUrl);
          fs.writeFileSync("www/index.html", html);
          console.log("Injected:", { verCode, verName, repo, hasApiUrl: !!apiUrl });

          // Guarantee captureInput: false so Android Gboard/Laban Vietnamese Telex IME works 100%
          if (fs.existsSync("capacitor.config.json")) {
            try {
              const cc = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              cc.android = { ...(cc.android || {}), captureInput: false, allowMixedContent: true };
              fs.writeFileSync("capacitor.config.json", JSON.stringify(cc, null, 2));
              console.log("Enforced capacitor.config.json captureInput=false");
            } catch {}
          }
          EOF

          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android

      - name: Tích hợp Native Android Foreground Service & Thông báo nền (1B + 7.2B)
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const pkgDir = "android/app/src/main/java/com/bang/chatgpt";
          fs.mkdirSync(pkgDir, { recursive: true });

          const serviceJava = `package com.bang.chatgpt;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class ApiAiKeepAliveService extends Service {
              public static final String CHANNEL_RUNNING = "apiai_running";
              public static final int NOTIF_ID = 3301;
              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannels(this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "APIAI::BackgroundTaskLock");
                      wakeLock.setReferenceCounted(false);
                      wakeLock.acquire(20 * 60 * 1000L);
                  }
                  WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                  if (wm != null) {
                      wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "APIAI::WifiKeepAlive");
                      wifiLock.setReferenceCounted(false);
                      wifiLock.acquire();
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) {
                      releaseLocks();
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  String title = intent != null && intent.getStringExtra("title") != null
                      ? intent.getStringExtra("title") : "API AI đang xử lý ngầm";
                  String body = intent != null && intent.getStringExtra("body") != null
                      ? intent.getStringExtra("body") : "Đang giữ kết nối để hoàn tất tác vụ của bạn...";

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification notif = new NotificationCompat.Builder(this, CHANNEL_RUNNING)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setContentIntent(pi)
                      .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  } else {
                      startForeground(NOTIF_ID, notif);
                  }
                  return START_STICKY;
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  // Stop background execution immediately ONLY when user swipes app out of Recents multitasking
                  releaseLocks();
                  stopForeground(true);
                  stopSelf();
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  releaseLocks();
                  super.onDestroy();
              }

              private void releaseLocks() {
                  try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception ignored) {}
                  try { if (wifiLock != null && wifiLock.isHeld()) wifiLock.release(); } catch (Exception ignored) {}
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              public static void createChannels(Context ctx) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      NotificationChannel chRun = new NotificationChannel(
                          CHANNEL_RUNNING, "Tác vụ nền API AI", NotificationManager.IMPORTANCE_LOW
                      );
                      chRun.setDescription("Giữ kết nối khi AI đang trả lời hoặc chạy đội ngũ");
                      nm.createNotificationChannel(chRun);

                      NotificationChannel chDone = new NotificationChannel(
                          "apiai_alerts", "Thông báo hoàn tất & Gia sư AI", NotificationManager.IMPORTANCE_HIGH
                      );
                      chDone.setDescription("Báo khi AI trả lời xong hoặc nhắc lịch học Gia sư");
                      chDone.enableVibration(true);
                      nm.createNotificationChannel(chDone);
                  }
              }
          }
          `;
          fs.writeFileSync(path.join(pkgDir, "ApiAiKeepAliveService.java"), serviceJava);

          const receiverJava = `package com.bang.chatgpt;

          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.app.NotificationCompat;

          public class ApiAiTutorAlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  ApiAiKeepAliveService.createChannels(context);
                  String tutorId = intent.getStringExtra("tutorId");
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  if (title == null) title = "Gia sư AI nhắc lịch học";
                  if (body == null) body = "Nay chưa vào học à? Bấm để bắt đầu bài học hôm nay!";

                  Intent openIntent = new Intent(context, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  if (tutorId != null) openIntent.putExtra("openTutorId", tutorId);
                  PendingIntent pi = PendingIntent.getActivity(
                      context, (tutorId != null ? tutorId.hashCode() : 4401), openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder b = new NotificationCompat.Builder(context, "apiai_alerts")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pi);

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) {
                      nm.notify((tutorId != null ? tutorId.hashCode() : 4401), b.build());
                  }
              }
          }
          `;
          fs.writeFileSync(path.join(pkgDir, "ApiAiTutorAlarmReceiver.java"), receiverJava);

          const pluginJava = `package com.bang.chatgpt;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ApiAiBackground")
          public class ApiAiBackgroundPlugin extends Plugin {
              @PluginMethod
              public void requestNotifyPermission(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(getActivity(), new String[]{Manifest.permission.POST_NOTIFICATIONS}, 3302);
                      }
                  }
                  call.resolve();
              }

              @PluginMethod
              public void startTask(PluginCall call) {
                  Context ctx = getContext();
                  Intent it = new Intent(ctx, ApiAiKeepAliveService.class);
                  it.putExtra("title", call.getString("title", "API AI đang xử lý"));
                  it.putExtra("body", call.getString("body", "Đang giữ kết nối nền..."));
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      ctx.startForegroundService(it);
                  } else {
                      ctx.startService(it);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void stopTask(PluginCall call) {
                  Context ctx = getContext();
                  Intent it = new Intent(ctx, ApiAiKeepAliveService.class);
                  it.setAction("STOP");
                  try { ctx.startService(it); } catch (Exception ignored) {}
                  call.resolve();
              }

              @PluginMethod
              public void notifyDone(PluginCall call) {
                  Context ctx = getContext();
                  ApiAiKeepAliveService.createChannels(ctx);
                  String title = call.getString("title", "API AI đã hoàn tất");
                  String body = call.getString("body", "Bấm để xem kết quả chi tiết.");
                  int id = call.getInt("id", (int) (System.currentTimeMillis() % 100000));

                  Intent openIntent = new Intent(ctx, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                      ctx, id, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, "apiai_alerts")
                      .setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pi);

                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(id, b.build());
                  call.resolve();
              }

              @PluginMethod
              public void scheduleTutorReminder(PluginCall call) {
                  Context ctx = getContext();
                  String tutorId = call.getString("tutorId", "tutor");
                  String title = call.getString("title", "Gia sư AI nhắc lịch học");
                  String body = call.getString("body", "Nay chưa vào học à?");
                  long triggerAt = call.getLong("triggerAtMs", System.currentTimeMillis() + 3600000L);

                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am != null) {
                      Intent it = new Intent(ctx, ApiAiTutorAlarmReceiver.class);
                      it.putExtra("tutorId", tutorId);
                      it.putExtra("title", title);
                      it.putExtra("body", body);
                      PendingIntent pi = PendingIntent.getBroadcast(
                          ctx, tutorId.hashCode(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void cancelTutorReminder(PluginCall call) {
                  Context ctx = getContext();
                  String tutorId = call.getString("tutorId", "tutor");
                  AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                  if (am != null) {
                      Intent it = new Intent(ctx, ApiAiTutorAlarmReceiver.class);
                      PendingIntent pi = PendingIntent.getBroadcast(
                          ctx, tutorId.hashCode(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      am.cancel(pi);
                  }
                  call.resolve();
              }
          }
          `;
          fs.writeFileSync(path.join(pkgDir, "ApiAiBackgroundPlugin.java"), pluginJava);

          const mainActJava = `package com.bang.chatgpt;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApiAiBackgroundPlugin.class);
                  super.onCreate(savedInstanceState);
                  dispatchTutorIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  dispatchTutorIntent(intent);
              }

              private void dispatchTutorIntent(Intent intent) {
                  if (intent != null && intent.hasExtra("openTutorId")) {
                      final String tid = intent.getStringExtra("openTutorId");
                      if (tid != null && getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().postDelayed(() -> {
                              getBridge().getWebView().evaluateJavascript(
                                  "window.__OPEN_TUTOR_FROM_NOTIF__ && window.__OPEN_TUTOR_FROM_NOTIF__(" + org.json.JSONObject.quote(tid) + ");",
                                  null
                              );
                          }, 800);
                      }
                  }
              }
          }
          `;
          fs.writeFileSync(path.join(pkgDir, "MainActivity.java"), mainActJava);
          console.log("Injected Native Android Background Service + Tutor Alarm Plugin.");
          EOF

      - name: Thay toàn bộ Icon App Android bằng logo.png
        run: |
          if [ -f "www/logo.png" ]; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
            for spec in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
              IFS=':' read -r D S FG <<< "$spec"
              DIR="android/app/src/main/res/mipmap-$D"
              mkdir -p "$DIR"
              convert www/logo.png -resize "${S}x${S}" "$DIR/ic_launcher.png"
              convert www/logo.png -resize "${S}x${S}" "$DIR/ic_launcher_round.png"
              convert www/logo.png -resize "${FG}x${FG}" "$DIR/ic_launcher_foreground.png"
            done
            mkdir -p android/app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#07080d</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
            echo "Da thay Icon App Android thanh cong."
          fi

      - name: Chuẩn bị Keystore ký cố định
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          PASS="${KS_PASS:-BangChatGPT2026!}"
          ALIAS="${KEY_ALIAS:-chatgptkey}"
          KPASS="${KEY_PASS:-$PASS}"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KPASS" >> "$GITHUB_ENV"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Da nap Keystore co dinh tu GitHub Secrets."
          else
            keytool -genkey -v -keystore android/app/release.jks \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KPASS" \
              -dname "CN=APIAI, OU=App, O=BangDev, L=HungYen, S=VN, C=VN"
            mkdir -p keystore-export
            base64 -w 0 android/app/release.jks > keystore-export/ANDROID_KEYSTORE_BASE64.txt
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cấu hình AndroidManifest, Google Maven Mirror và Signing Release
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          node << 'EOF'
          const fs = require("fs");
          const verCode = 10 + parseInt(process.env.RUN_NUM || "1", 10);
          const verName = `2.0.${process.env.RUN_NUM || "1"}`;

          const mPath = "android/app/src/main/AndroidManifest.xml";
          let xml = fs.readFileSync(mPath, "utf8");
          const perms = [
            "android.permission.INTERNET",
            "android.permission.RECORD_AUDIO",
            "android.permission.CAMERA",
            "android.permission.MODIFY_AUDIO_SETTINGS",
            "android.permission.VIBRATE",
            "android.permission.WAKE_LOCK",
            "android.permission.FOREGROUND_SERVICE",
            "android.permission.FOREGROUND_SERVICE_DATA_SYNC",
            "android.permission.POST_NOTIFICATIONS",
            "android.permission.SCHEDULE_EXACT_ALARM"
          ];
          for (const p of perms) {
            if (!xml.includes(p)) {
              xml = xml.replace("<application", `<uses-permission android:name="${p}" />\n    <application`);
            }
          }
          if (!xml.includes("usesCleartextTraffic")) {
            xml = xml.replace("<application", `<application android:usesCleartextTraffic="true"`);
          }
          if (!xml.includes("ApiAiKeepAliveService")) {
            xml = xml.replace(
              "</application>",
              `    <service android:name=".ApiAiKeepAliveService" android:enabled="true" android:exported="false" android:foregroundServiceType="dataSync" />\n        <receiver android:name=".ApiAiTutorAlarmReceiver" android:enabled="true" android:exported="false" />\n    </application>`
            );
          }
          fs.writeFileSync(mPath, xml);

          const sPath = "android/app/src/main/res/values/styles.xml";
          let styles = fs.readFileSync(sPath, "utf8");
          if (!styles.includes("statusBarColor")) {
            styles = styles.replace(
              "</style>",
              '    <item name="android:statusBarColor">#07080d</item>\n        <item name="android:navigationBarColor">#07080d</item>\n        <item name="android:windowBackground">#07080d</item>\n    </style>'
            );
            fs.writeFileSync(sPath, styles);
          }

          const rootGradlePath = "android/build.gradle";
          if (fs.existsSync(rootGradlePath)) {
            let rg = fs.readFileSync(rootGradlePath, "utf8");
            rg = rg.replace(
              /mavenCentral\(\)/g,
              'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }\n        mavenCentral()'
            );
            fs.writeFileSync(rootGradlePath, rg);
          }

          const gPath = "android/app/build.gradle";
          let gradle = fs.readFileSync(gPath, "utf8");
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${verCode}`);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${verName}"`);
          const signingBlock = [
            "signingConfigs {",
            "        release {",
            '            storeFile file("release.jks")',
            '            storePassword System.getenv("KS_PASS")',
            '            keyAlias System.getenv("KEY_ALIAS")',
            '            keyPassword System.getenv("KEY_PASS")',
            "        }",
            "    }",
            "    buildTypes {",
            "        release {",
            "            signingConfig signingConfigs.release"
          ].join("\n    ");
          gradle = gradle.replace(/buildTypes\s*\{\s*release\s*\{/, signingBlock);
          fs.writeFileSync(gPath, gradle);
          EOF
          npx cap sync android

      - name: Biên dịch Release APK đã ký (có tự động thử lại khi 429)
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "=== Gradle assembleRelease lan thu $attempt/3 ==="
            if ./gradlew assembleRelease --no-daemon --max-workers=2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build that bai sau 3 lan thu."
              exit 1
            fi
            WAIT=$((attempt * 20))
            echo "Gap loi mang/429, doi ${WAIT}s roi thu lai..."
            sleep "$WAIT"
          done
          cp app/build/outputs/apk/release/app-release.apk ../API-AI-v2.0.${{ github.run_number }}.apk

      - name: Xuất Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: API-AI-v2.0.${{ github.run_number }}-APK
          path: API-AI-v2.0.${{ github.run_number }}.apk
          retention-days: 30

      - name: Xuất file Keystore Base64 lần đầu
        if: steps.keystore.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-TO-SECRET-ANDROID_KEYSTORE_BASE64
          path: keystore-export/ANDROID_KEYSTORE_BASE64.txt
          retention-days: 7

      - name: Tạo GitHub Release cho In-App Updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: API AI v2.0.${{ github.run_number }}
          body: |
            Bản cập nhật API AI v2.0.${{ github.run_number }} (Build #${{ github.run_number }}).
            Tải file APK bên dưới và bấm Cập nhật trực tiếp không cần gỡ bản cũ.
          files: API-AI-v2.0.${{ github.run_number }}.apk
